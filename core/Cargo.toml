[workspace]
resolver = "3"
members = ["engine", "dictc", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/pingolindev/keyboard-public"
publish = false

[workspace.dependencies]
uniffi = "0.30"
unicode-normalization = "0.1.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
