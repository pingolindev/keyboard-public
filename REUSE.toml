version = 1
SPDX-PackageName = "Pingolin Keyboard"
SPDX-PackageDownloadLocation = "https://github.com/pingolindev/keyboard-public"

# Files that cannot carry a header. Outside core/ the app's license applies.
[[annotations]]
path = ["README.md", "CONTRIBUTING.md", "SECURITY.md", "PRIVACY.md", "REUSE.toml", ".gitignore", ".gitattributes", "docs/**", "fastlane/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pingolin LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "core/Cargo.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pingolin LLC"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The Contributor Covenant, version 2.1.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "2014 Coraline Ada Ehmke and the Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The Gradle wrapper, as generated by Gradle 9.6.1.
[[annotations]]
path = ["android/gradlew", "android/gradlew.bat", "android/gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "2015 the original authors of Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Word lists converted from AOSP LatinIME (sources in dictionaries/*/README.md).
# The files carry these headers too. This covers files `reuse` takes for binary.
[[annotations]]
path = ["dictionaries/*/words.tsv", "dictionaries/*/corrections.tsv", "dictionaries/*/metadata.tsv"]
precedence = "closest"
SPDX-FileCopyrightText = "The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"

# Word pairs counted in Tatoeba sentences, CC BY 2.0 FR.
[[annotations]]
path = "dictionaries/*/pairs.tsv"
precedence = "closest"
SPDX-FileCopyrightText = "Tatoeba contributors <https://tatoeba.org>"
SPDX-License-Identifier = "LicenseRef-CC-BY-2.0-FR"

# Emoji names and search words from Unicode CLDR, after each language's common
# words from AOSP. The files carry these headers too (see above).
[[annotations]]
path = "emoji/names/*.tsv"
precedence = "closest"
SPDX-FileCopyrightText = ["2026 Unicode, Inc.", "The Android Open Source Project"]
SPDX-License-Identifier = "Unicode-3.0 AND Apache-2.0"

# whisper.cpp v1.9.5 and its ggml, vendored for offline voice typing
# (core/engine/whisper/LICENSE). pk_voice.cpp is our own and says so itself.
[[annotations]]
path = "core/engine/whisper/**"
precedence = "closest"
SPDX-FileCopyrightText = "2023-2026 The ggml authors"
SPDX-License-Identifier = "MIT"
